<style>

  }

    margin: 0;
    padding: 0;
  }
  .desk {
    width: 100%;
    height: 560px;
    background: #2a1a08;
    position: relative;
    overflow: hidden;
    font-family: "Courier Prime", monospace;
    user-select: none;
  }
  .clickable {
    cursor: pointer;
    transition: filter 0.12s;
    position: absolute;
  }
  .clickable:hover {
    filter: brightness(1.18);
  }
  .clickable:active {
    filter: brightness(0.9);
  }
  .folder {
    width: 120px;
    background: #c8a84b;
    border: 2px solid #8b6914;
    border-radius: 3px 3px 2px 2px;
  }
  .folder-tab {
    background: #a07810;
    height: 16px;
    border-radius: 2px 2px 0 0;
    display: flex;
    align-items: center;
    padding: 0 7px;
    font-family: "Special Elite", serif;
    font-size: 8px;
    color: #fff0c0;
    letter-spacing: 1px;
  }
  .folder-body {
    background: #d4aa50;
    padding: 8px 8px 10px;
    border-top: 1px solid #8b6914;
  }
  .fline {
    background: #b88820;
    height: 4px;
    border-radius: 1px;
    margin-bottom: 4px;
  }
  .flbl {
    font-family: "Special Elite", serif;
    font-size: 10px;
    color: #3a1a00;
    line-height: 1.3;
  }
  .fsub {
    font-size: 8px;
    color: #7a5010;
    margin-top: 2px;
  }
  .box-outer {
    position: absolute;
    cursor: pointer;
    width: 100px;
    height: 68px;
    transition: filter 0.12s;
  }
  .box-outer:hover {
    filter: brightness(1.18);
  }
  .box-body {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: #8b7355;
    border: 2px solid #5a4020;
    border-radius: 0 0 3px 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .box-lid-el {
    position: absolute;
    top: 0;
    left: -1px;
    right: -1px;
    height: 20px;
    background: #a08060;
    border: 2px solid #5a4020;
    border-radius: 3px;
    transform-origin: 50% 100%;
    transition: transform 0.5s ease;
    z-index: 2;
  }
  .blbl {
    font-family: "Special Elite", serif;
    font-size: 8px;
    color: #f0d890;
    letter-spacing: 1px;
    margin-top: 14px;
  }
  .bsub {
    font-size: 7px;
    color: #c0a060;
    margin-top: 1px;
  }
  .book-wrap {
    width: 88px;
    height: 72px;
    background: #5a2810;
    border: 2px solid #3a1808;
    border-radius: 4px 2px 2px 4px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .book-spine {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 13px;
    background: #3a1808;
    border-radius: 3px 0 0 3px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .book-spine-txt {
    font-family: "Special Elite", serif;
    font-size: 6px;
    color: #c8905a;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
  }
  .book-cover-txt {
    font-family: "Special Elite", serif;
    font-size: 8px;
    color: #f0c880;
    text-align: center;

  .panel {

  }
  .ph {

    color: #f5e0a0;
    font-family: "Special Elite", serif;
    font-size: 9px;
    letter-spacing: 2px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 2px 2px 0 0;
  }
  .px {
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    color: #f5e0a0;
  }
  .pb {
    padding: 10px 12px;
    font-size: 9px;
    color: #1a0800;
    line-height: 1.9;
    font-family: "Courier Prime", monospace;
  }
  .pfl {

    color: #7a4a08;
    font-weight: 700;
    margin-top: 4px;

  .pfv {
    font-size: 10px;
    color: #1a0800;
  }
  .stamp {

    right: 8px;
    top: 28px;

    color: #c0392b;
    font-size: 7px;
    font-family: "Special Elite", serif;
    padding: 2px 4px;
    transform: rotate(7deg);
    opacity: 0.65;
    letter-spacing: 1px;
  }
  .book-panel {
    position: absolute;
    z-index: 30;
    border: 2px solid #7a5a20;
    border-radius: 3px;
    background: #e8ddb8;
    display: flex;
    flex-direction: column;
    min-width: 340px;
    min-height: 200px;
  }
  .drag-handle {
    background: #5a3a10;
    color: #f0d080;
    font-family: "Special Elite", serif;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 5px 8px;

    align-items: center;
    border-radius: 2px 2px 0 0;
    cursor: grab;
    flex-shrink: 0;
  }
  .drag-handle:active {
    cursor: grabbing;
  }
  .drag-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #f0d080;

  }
  .bp-cols {

  }
  .bp-left {

  .tax-order-hd {

    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  .tax-order-hd:hover .tax-name {
    color: #3a1000;
  }

  .tax-name {

  }

    color: #9a7040;
    font-style: italic;
    display: block;
    margin-left: 14px;
    margin-bottom: 2px;
  }
  .tax-family-list {
    margin-left: 8px;
    display: none;
  }
  .tax-family-list.open {
    display: block;
  }
  .tax-family {
    padding: 3px 6px 3px 0;
    border-bottom: 1px solid #c8b070;
  }
  .tax-family:last-child {
    border-bottom: none;
  }
  .tax-family-hd {
    display: flex;
    align-items: center;
    gap: 3px;

    user-select: none;

  .tax-family-hd:hover .tax-fname {

  .tax-fname {

    font-size: 8px;

    line-height: 1.4;
  }
  .tax-flatin {

    color: #9a7040;
    font-style: italic;
    display: block;
    margin-left: 14px;
    margin-bottom: 2px;

    margin-left: 8px;
    display: none;

    display: block;

  .genus-item:last-child {
    border-bottom: none;
  }
  .genus-item:hover {
    background: #cfc090;
  }
  .genus-item.act {
    background: #5a3010;
  }
  .genus-item .gi-name {
    font-family: "Special Elite", serif;
    font-size: 8px;
    color: #3a1800;
    display: block;
    line-height: 1.3;

    color: #f0d890;
  }

    color: #c0a060;
  }

    font-style: italic;
    padding: 3px 6px;
    line-height: 1.4;
  }

    padding: 10px 12px;
    background: #f0e8cc;
    overflow-y: auto;
    min-width: 0;

    color: #3a1800;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .el {

    color: #7a5020;
    font-style: italic;
    margin-bottom: 6px;
  }
  .eb {

    color: #1a0800;
    line-height: 1.85;
  }
  .ediv {
    border: none;

    margin: 5px 0;
  }
  /* resize handle */
  .bp-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 12px;
    height: 12px;
    cursor: se-resize;
    z-index: 5;
  }
  .bp-resize::after {
    content: "";
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 6px;
    height: 6px;
    border-right: 2px solid #8a6030;
    border-bottom: 2px solid #8a6030;
    opacity: 0.6;
  }
  .spec-card {
    position: absolute;
    left: 3%;
    top: 52%;
    z-index: 20;

    border: 2px solid #9a8850;

    width: 118px;
    padding: 8px;
    text-align: center;
    display: none;
  }
  .hint-bar {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 8px;
    color: #8b6030;
    font-family: "Special Elite", serif;
    letter-spacing: 1px;
    pointer-events: none;

</style>

<script>
  // ── 渲染分类树 ──────────────────────────────────────────
  function buildTree() {
    const tree = document.getElementById("bp-tree");
    tree.innerHTML = "";
    INSECT_ATLAS.forEach((order) => {
      const orderDiv = document.createElement("div");
      orderDiv.className = "tax-order";

      const hd = document.createElement("div");
      hd.className = "tax-order-hd";
      hd.innerHTML = `<span class="tax-arrow">▶</span><span class="tax-name">${order.order}</span>`;
      orderDiv.appendChild(hd);

      const latinSpan = document.createElement("span");
      latinSpan.className = "tax-latin-sm";
      latinSpan.textContent = order.latin;
      orderDiv.appendChild(latinSpan);

      const familyList = document.createElement("div");
      familyList.className = "tax-family-list";

      order.families.forEach((fam) => {
        const famDiv = document.createElement("div");
        famDiv.className = "tax-family";

        const famHd = document.createElement("div");
        famHd.className = "tax-family-hd";
        famHd.innerHTML = `<span class="tax-arrow">▶</span><span class="tax-fname">${fam.family}</span>`;
        famDiv.appendChild(famHd);

        const famLatin = document.createElement("span");
        famLatin.className = "tax-flatin";
        famLatin.textContent = fam.latin;
        famDiv.appendChild(famLatin);

        const genusList = document.createElement("div");
        genusList.className = "tax-genus-list";

        if (!fam.genera || fam.genera.length === 0) {
          genusList.innerHTML = '<div class="tax-empty">（待补充）</div>';
        } else {
          fam.genera.forEach((genus) => {
            const gi = document.createElement("div");
            gi.className = "genus-item";
            gi.innerHTML = `<span class="gi-name">${genus.genus}</span><span class="gi-latin">${genus.latin}</span>`;
            gi.addEventListener("click", () => {
              document
                .querySelectorAll(".genus-item")
                .forEach((x) => x.classList.remove("act"));
              gi.classList.add("act");
              if (genus.entry) renderEntry(genus.entry);
              else showEmpty(genus.genus);
            });
            genusList.appendChild(gi);
          });
        }

        famDiv.appendChild(genusList);

        famHd.addEventListener("click", () => {
          const arr = famHd.querySelector(".tax-arrow");
          const open = genusList.classList.toggle("open");
          arr.classList.toggle("open", open);
        });

        famDiv.appendChild(genusList);
        familyList.appendChild(famDiv);
      });

      orderDiv.appendChild(familyList);

      hd.addEventListener("click", () => {
        const arr = hd.querySelector(".tax-arrow");
        const open = familyList.classList.toggle("open");
        arr.classList.toggle("open", open);
      });

      tree.appendChild(orderDiv);
    });
  }

  function renderEntry(e) {
    document.getElementById("bp-content").innerHTML =
      `<div class="en">${e.name}</div><div class="el">${e.latin}</div>
     <div class="eb" style="margin-top:8px">${e.body}</div>`;
  }

  function showEmpty(name) {
    document.getElementById("bp-content").innerHTML =
      `<div class="en">${name}</div>
     <div style="color:#9a7840;font-family:'Special Elite',serif;font-size:9px;margin-top:16px;line-height:2">（种级数据待补充）</div>`;
  }

  // ── 面板开关 ────────────────────────────────────────────
  let boxOpen = false;

  function positionBook() {
    const desk = document.getElementById("desk");
    const book = document.getElementById("book-obj");
    book.style.left =
      desk.offsetWidth - 80 - Math.round(desk.offsetWidth * 0.03) + "px";
  }
  positionBook();
  window.addEventListener("resize", positionBook);

  function togglePanel(id) {
    const el = document.getElementById(id);
    const show = el.style.display === "none";
    el.style.display = show ? "flex" : "none";
    if (show) {
      document.getElementById("hint").style.display = "none";
      if (id === "bp") buildTree();
    }
  }

  function openBox() {
    if (boxOpen) return;
    boxOpen = true;
    const bi = document.getElementById("box-item");
    bi.style.cursor = "default";
    bi.onclick = null;
    document.getElementById("box-lid").style.transform =
      "rotateX(-120deg) translateY(-6px)";
    setTimeout(() => {
      document.getElementById("spec-card").style.display = "block";
      document.getElementById("hint").style.display = "none";
    }, 560);
  }

  // ── 图鉴拖动 ────────────────────────────────────────────
  (function () {
    const panel = document.getElementById("bp");
    const handle = document.getElementById("bp-handle");
    const desk = document.getElementById("desk");
    let dragging = false,
      ox = 0,
      oy = 0;
    handle.addEventListener("mousedown", function (e) {
      if (e.target.classList.contains("px")) return;
      dragging = true;
      const r = panel.getBoundingClientRect();
      const dr = desk.getBoundingClientRect();
      ox = e.clientX - (r.left - dr.left);
      oy = e.clientY - (r.top - dr.top);
      panel.style.zIndex = 40;
      e.preventDefault();
    });
    document.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      const dr = desk.getBoundingClientRect();
      let nx = e.clientX - dr.left - ox;
      let ny = e.clientY - dr.top - oy;
      nx = Math.max(0, Math.min(nx, dr.width - panel.offsetWidth));
      ny = Math.max(0, Math.min(ny, dr.height - panel.offsetHeight));
      panel.style.left = nx + "px";
      panel.style.top = ny + "px";
      panel.style.right = "auto";
    });
    document.addEventListener("mouseup", function () {
      dragging = false;
      panel.style.zIndex = 30;
    });
  })();

  // ── 图鉴调整大小 ─────────────────────────────────────────
  (function () {
    const panel = document.getElementById("bp");
    const resizer = document.getElementById("bp-resize");
    const desk = document.getElementById("desk");
    let resizing = false,
      startX,
      startY,
      startW,
      startH;
    resizer.addEventListener("mousedown", function (e) {
      resizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startW = panel.offsetWidth;
      startH = panel.offsetHeight;
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener("mousemove", function (e) {
      if (!resizing) return;
      const dr = desk.getBoundingClientRect();
      const panelLeft = panel.getBoundingClientRect().left - dr.left;
      const panelTop = panel.getBoundingClientRect().top - dr.top;
      let nw = startW + (e.clientX - startX);
      let nh = startH + (e.clientY - startY);
      nw = Math.max(340, Math.min(nw, dr.width - panelLeft));
      nh = Math.max(200, Math.min(nh, dr.height - panelTop));
      panel.style.width = nw + "px";
      panel.style.height = nh + "px";
    });
    document.addEventListener("mouseup", function () {
      resizing = false;
    });
  })();
</script>
